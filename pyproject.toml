[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audience-miner"
version = "0.1.0"
description = "Bounded note audience discovery and scoring"
requires-python = ">=3.11"

[project.scripts]
audience-miner = "audience_miner.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["audience_miner"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
